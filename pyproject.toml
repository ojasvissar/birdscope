[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldwork-ebird"
version = "0.1.0"
description = "A reproducible eBird conservation analysis workbench"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy==2.0.2", "pandas==2.3.3", "duckdb==1.4.4", "scikit-learn==1.6.1", "scipy==1.13.1"]

[project.scripts]
fieldwork = "fieldwork.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
